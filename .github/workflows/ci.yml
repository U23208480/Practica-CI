name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar (verificar sintaxis)
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test

  artefacto:
    name: Generar y publicar artefacto
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Crear paquete ZIP
        run: zip -r paquete.zip src package.json README.md

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: paquete
          path: paquete.zip
