name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar (verificar sintaxis)
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test
